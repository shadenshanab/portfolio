    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Shaden Shanab",
        "jobTitle": "Full-stack Data Scientist",
        "url": "https://shaden-ai.com",

        ]

    <!-- Set the theme before first paint so dark-mode visitors never see a white flash. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('shaden-theme')
          var t = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
